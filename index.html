<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>MJ Stock</title>
  <link id="app-icon" rel="icon" type="image/png" />
  <link id="apple-icon" rel="apple-touch-icon" />
  <link id="app-manifest" rel="manifest" />
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 12px; }
    .header { background: #1e293b; padding: 14px; border-radius: 12px; margin-bottom: 12px; border: 1px solid #334155; }
    .header h1 { margin: 0 0 6px 0; font-size: 20px; color: #38bdf8; }
    .meta { font-size: 12px; color: #94a3b8; line-height: 1.5; }
    .tabs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 14px; }
    .tab-btn { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; padding: 10px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; text-align: left; cursor: pointer; }
    .tab-btn.active { background: #0284c7; color: #ffffff; border-color: #38bdf8; }
    .badge { float: right; background: rgba(0,0,0,0.3); padding: 2px 7px; border-radius: 999px; font-size: 11px; }
    .card { display: block; text-decoration: none; color: inherit; background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 12px; margin-bottom: 10px; transition: border-color 0.15s; }
    .card:active { border-color: #38bdf8; background: #162032; }
    .row-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .sym { font-size: 16px; font-weight: 700; color: #f8fafc; }
    .chart-tag { font-size: 11px; color: #38bdf8; background: rgba(56, 189, 248, 0.12); padding: 2px 6px; border-radius: 5px; margin-left: 6px; font-weight: 600; }
    .price { font-size: 15px; font-weight: 700; }
    .up { color: #4ade80; }
    .down { color: #f87171; }
    .levels { display: flex; justify-content: space-between; font-size: 12px; color: #cbd5e1; background: #0f172a; padding: 7px 10px; border-radius: 6px; }
    .empty { text-align: center; color: #94a3b8; padding: 30px 10px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>MJ Stock — EOD Scanners</h1>
    <div class="meta" id="metaInfo">डेटा लोड हो रहा है...</div>
  </div>

  <div class="tabs" id="tabBar"></div>
  <div id="stockList"></div>

  <script>
    (function setupAppIcon() {
      const c = document.createElement("canvas");
      c.width = 512; c.height = 512;
      const ctx = c.getContext("2d");

      const grad = ctx.createLinearGradient(0, 0, 512, 512);
      grad.addColorStop(0, "#0284c7");
      grad.addColorStop(1, "#0f172a");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 512);

      ctx.strokeStyle = "#4ade80";
      ctx.lineWidth = 22;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.beginPath();
      ctx.moveTo(85, 385);
      ctx.lineTo(195, 325);
      ctx.lineTo(280, 355);
      ctx.lineTo(425, 225);
      ctx.stroke();

      ctx.fillStyle = "#4ade80";
      ctx.beginPath();
      ctx.moveTo(435, 215);
      ctx.lineTo(380, 220);
      ctx.lineTo(422, 268);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.font = "900 175px system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("MJ", 256, 215);

      const iconData = c.toDataURL("image/png");
      document.getElementById("app-icon").href = iconData;
      document.getElementById("apple-icon").href = iconData;

      const manifest = {
        name: "MJ Stock",
        short_name: "MJ Stock",
        start_url: "https://mjain681-blip.github.io/mj-stock/",
        display: "standalone",
        background_color: "#0f172a",
        theme_color: "#0f172a",
        icons: [{ src: iconData, sizes: "512x512", type: "image/png" }]
      };
      const blob = new Blob([JSON.stringify(manifest)], { type: "application/json" });
      document.getElementById("app-manifest").href = URL.createObjectURL(blob);
    })();

    const DB_URL = "https://mj-stock-15f1b-default-rtdb.asia-southeast1.firebasedatabase.app/mj_eod_scanners.json";
    const SCANNERS = [
      { key: "s1_200ema_squeeze_up", label: "1. 200EMA Squeeze Up" },
      { key: "s2_200ema_breakdown", label: "2. 200EMA Breakdown" },
      { key: "s3_next_day_squeeze", label: "3. Next-Day Squeeze" },
      { key: "s4_consolidation_7d", label: "4. 7D Consolidation (4%)" },
      { key: "s5_7days_range_bound", label: "5. 7D Range Bound" },
      { key: "s6_two_hour_close", label: "6. 2Hr Close (1:30-3:30)" }
    ];

    let appData = {};
    let activeKey = SCANNERS[0].key;

    function renderTabs() {
      const bar = document.getElementById("tabBar");
      bar.innerHTML = SCANNERS.map(s => {
        const count = (appData[s.key] || []).length;
        const cls = s.key === activeKey ? "tab-btn active" : "tab-btn";
        return `<button class="${cls}" onclick="selectTab('${s.key}')">${s.label}<span class="badge">${count}</span></button>`;
      }).join("");
    }

    function selectTab(key) {
      activeKey = key;
      renderTabs();
      renderStocks();
    }

    function renderStocks() {
      const list = document.getElementById("stockList");
      const items = appData[activeKey] || [];
      if (!items.length) {
        list.innerHTML = `<div class="empty">इस स्कैनर में आज कोई स्टॉक नहीं आया है।</div>`;
        return;
      }
      list.innerHTML = items.map(st => {
        const pctCls = st.pct >= 0 ? "up" : "down";
        const sign = st.pct >= 0 ? "+" : "";
        const tvSym = encodeURIComponent("NSE:" + st.symbol.replace(/&/g, "_"));
        const tvUrl = `https://www.tradingview.com/chart/?symbol=${tvSym}`;
        return `
          <a class="card" href="${tvUrl}" target="_blank" rel="noopener noreferrer">
            <div class="row-top">
              <div><span class="sym">${st.symbol}</span><span class="chart-tag">Chart ↗</span></div>
              <span class="price ${pctCls}">₹${st.close} (${sign}${st.pct}%)</span>
            </div>
            <div class="levels">
              <span><b>PDH:</b> ₹${st.pdh}</span>
              <span><b>PDL:</b> ₹${st.pdl}</span>
              <span><b>Vol:</b> ${(st.vol / 100000).toFixed(2)}L</span>
            </div>
          </a>`;
      }).join("");
    }

    fetch(DB_URL)
      .then(r => r.json())
      .then(data => {
        appData = data || {};
        document.getElementById("metaInfo").innerHTML =
          `मार्केट डेटा तारीख़: <b>${appData.market_date || "-"}</b><br>आख़िरी अपडेट: ${appData.updated_at || "-"}`;
        renderTabs();
        renderStocks();
      })
      .catch(() => {
        document.getElementById("metaInfo").innerText = "डेटा लोड करने में समस्या आई, पेज रीफ़्रेश करें।";
      });
  </script>
</body>
</html>
