<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MJ Stock</title>
<style>
  body { background: #0a0e17; color: #fff; font-family: sans-serif; margin: 0; padding: 12px; }
  .top { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 10px; margin-bottom: 12px; }
  .title { font-size: 20px; font-weight: bold; color: #38bdf8; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 14px; }
  .tab { background: #1e293b; color: #cbd5e1; border: none; padding: 7px 12px; border-radius: 16px; font-size: 12px; white-space: nowrap; }
  .tab.active { background: #0284c7; color: #fff; font-weight: bold; }
  .card { background: #111827; border-left: 4px solid #10b981; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .card.SELL { border-left-color: #ef4444; }
  .row { display: flex; justify-content: space-between; margin-bottom: 6px; }
  .sym { font-size: 17px; font-weight: bold; }
  .tag { font-size: 12px; color: #38bdf8; }
  .nums { display: flex; justify-content: space-between; background: #0a0e17; padding: 8px; border-radius: 6px; font-size: 12px; }
</style>
</head>
<body>
<div class="top">
  <div class="title">MJ STOCK <span style="color:#10b981">LIVE</span></div>
  <div id="status" style="font-size:11px; color:#10b981;">● READY</div>
</div>
<div class="tabs">
  <button class="tab active" onclick="filterData('ALL', this)">All</button>
  <button class="tab" onclick="filterData('7-8D Range Breakout', this)">7-8D Range</button>
  <button class="tab" onclick="filterData('5m VWAP + 20 EMA', this)">VWAP+EMA</button>
  <button class="tab" onclick="filterData('5m VWAP Cross', this)">VWAP</button>
  <button class="tab" onclick="filterData('PDH/PDL', this)">PDH/PDL</button>
</div>
<div id="list">Loading...</div>

<script>
const URL = "https://mj-stock-15f1b-default-rtdb.asia-southeast1.firebasedatabase.app/alerts.json";
let dataList = [];
let activeTab = "ALL";

function filterData(t, el) {
  activeTab = t;
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  show();
}

function show() {
  const box = document.getElementById('list');
  const items = activeTab === "ALL" ? dataList : dataList.filter(x => x.strategy === activeTab);
  if (!items.length) {
    box.innerHTML = "<p style='color:#94a3b8;text-align:center;margin-top:30px;'>Abhi koi naya signal nahi hai. Market hours (9:15 AM - 3:30 PM) mein yahan live alerts aayenge.</p>";
    return;
  }
  box.innerHTML = items.map(x => `
    <div class="card ${x.type}">
      <div class="row"><span class="sym">${x.symbol}</span><span style="font-weight:bold;color:${x.type==='BUY'?'#34d399':'#f87171'}">${x.type} @ ₹${x.cmp}</span></div>
      <div class="row"><span class="tag">⚡ ${x.strategy}</span><span style="font-size:11px;color:#94a3b8">${x.time}</span></div>
      <div class="nums"><span>VWAP: ₹${x.vwap}</span><span>EMA: ₹${x.ema20}</span><span style="color:#f87171">SL: ₹${x.sl}</span></div>
    </div>
  `).join('');
}

async function load() {
  try {
    const r = await fetch(URL);
    const d = await r.json();
    dataList = d ? Object.values(d).filter(x => x && x.symbol).reverse() : [];
    show();
  } catch (e) {
    document.getElementById('list').innerText = "Network error, retrying...";
  }
}
load();
setInterval(load, 4000);
</script>
</body>
</html>
