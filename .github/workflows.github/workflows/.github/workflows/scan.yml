name: MJ Stock Auto Scanner

on:
  schedule:
    # Mon-Fri 9:15 AM to 3:30 PM IST (03:45 to 10:00 UTC) har 5 minute mein
    - cron: '*/5 3-10 * * 1-5'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install libraries
        run: pip install yfinance pandas requests
      - name: Run F&O Scanner
        run: python scanner.py
        
