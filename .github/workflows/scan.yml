name: MJ Stock EOD Scanner

on:
  schedule:
    # रोज़ सोमवार से शुक्रवार शाम 6:15 PM IST (12:45 UTC) पर चलेगा
    - cron: '45 12 * * 1-5'
  workflow_dispatch: # मोबाइल से कभी भी "Run workflow" दबाकर चलाने के लिए

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install free libraries
        run: |
          pip install yfinance pandas numpy requests

      - name: Run MJ EOD Scanners
        run: python scanner.py
        
